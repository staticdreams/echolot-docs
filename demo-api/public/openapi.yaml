openapi: 3.1.0
info:
  title: Alpenglow demo shop
  version: 1.0.0
  summary: A pretend outdoor-gear shop for learning Echolot.
  description: |
    The API behind docs.echolot.dev's tutorials. Nothing in it is private and nothing sent to it is stored.
    Sign in with heidi@alpenglow.ch and the password alpenglow, or with OAuth 2 client credentials
    (alpenglow-demo / demo-secret).
  contact:
    url: https://docs.echolot.dev/docs/tutorials/demo-api
servers:
  - url: https://demo.echolot.dev/v1
tags:
  - name: Catalog
  - name: Auth
  - name: Orders
paths:
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List products
      parameters:
        - { name: q, in: query, description: Words that must all appear in the name, category or tags., schema: { type: string } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: in_stock, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [name, price, -price, rating], default: name } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: A page of products. Paging is also in the Link and X-Total-Count headers.
          headers:
            X-Total-Count: { schema: { type: integer } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [page, per_page, total, pages, items]
                properties:
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  pages: { type: integer }
                  next: { type: [string, 'null'] }
                  items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '400': { $ref: '#/components/responses/Problem' }
  /products/{sku}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get a product
      parameters:
        - { name: sku, in: path, required: true, schema: { type: string }, example: TNT-MH-2P }
      responses:
        '200':
          description: The product.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '304': { description: Not modified (If-None-Match matched). }
        '404': { $ref: '#/components/responses/Problem' }
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List categories
      responses:
        '200':
          description: Categories with their product counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { $ref: '#/components/schemas/Category' }
                        name: { type: string }
                        products: { type: integer }
  /auth/token:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: heidi@alpenglow.ch }
                password: { type: string, example: alpenglow }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string, example: alpenglow-demo }
                client_secret: { type: string, example: demo-secret }
      responses:
        '200':
          description: An access token, valid for an hour.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  scope: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  email: { type: string }
                  role: { type: string }
                  locale: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      description: Validated and priced, but not stored. The same Idempotency-Key gives the same order id.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string, example: TNT-MH-2P }
                      quantity: { type: integer, minimum: 1, maximum: 10 }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: The order.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, example: ord_7Hk2Lw }
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Nothing really changes; shipped and delivered orders answer 409.
      responses:
        '204': { description: Cancelled. }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: A problem (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Category:
      type: string
      enum: [tents, packs, sleeping, clothing, climbing]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, enum: [CHF] }
    Product:
      type: object
      required: [sku, name, category, price, stock]
      properties:
        sku: { type: string, example: TNT-MH-2P }
        name: { type: string, example: Matterhorn 2P Tent }
        category: { $ref: '#/components/schemas/Category' }
        price: { $ref: '#/components/schemas/Money' }
        weight_g: { type: integer }
        rating: { type: number }
        reviews: { type: integer }
        stock:
          type: object
          properties:
            zurich: { type: integer }
            bern: { type: integer }
        tags: { type: array, items: { type: string } }
    OrderStatus:
      type: string
      enum: [open, paid, shipped, delivered, cancelled]
    Order:
      type: object
      required: [id, status, lines, total]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              name: { type: string }
              quantity: { type: integer }
              price: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        note: { type: string }
        shipping:
          type: object
          properties:
            carrier: { type: string }
            estimate: { type: string, format: date }
            tracking: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
